# ============================================
#   CustomSpawners - spawners.yml
#   Configuração de cada tipo de spawner
# ============================================
spawners:
  # Tipo do mob
  zombie:
    type: zombie
    drops:
      list:
        - material: ROTTEN_FLESH
          min-amount: 1
          max-amount: 3
          chance: 1.0
  skeleton:
    type: skeleton
    drops:
      list:
        - material: ARROW
          min-amount: 0
          max-amount: 2
          chance: 1.0