# ============================================
#   CustomSpawners - spawners.yml
#   Configuração de cada tipo de spawner
# ============================================
spawners:
  zombie:
    # Tipo do spawner
    type: ZOMBIE
    # Item do mob spawner
    item:
      material: MOB_SPAWNER
      data: 0
      name: '&aSpawner de Zumbi'
      lore:
        - '&7Este spawner gera zumbis.'
    # Delay minimo para gerar mobs
    min-delay: 200
    # Delay maximo para gerar mobs
    max-delay: 800
    # Quantidade de mobs que irão nascer por rodada
    spawn-count: 4
    # A distancia
    spawn-range: 4
    drops:
      enable: false
      list:
        - material: ROTTEN_FLESH
          name: 'Carne Podre'
          lore:
            - '§7Carne de zumbi, não é muito nutritiva...'
            - '§7Pode ser usada para alimentar lobos.'
          enchants: []
          min-amount: 1
          max-amount: 3
          chance: 1.0
        - material: IRON_INGOT
          min-amount: 1
          max-amount: 1
          chance: 0.05
        - material: CARROT
          min-amount: 1
          max-amount: 1
          chance: 0.025

  skeleton:
    type: SKELETON
    item:
      material: MOB_SPAWNER
      data: 0
      name: '&aSpawner de Esqueleto'
      lore:
        - '&7Este spawner gera esqueletos.'
    min-delay: 200
    max-delay: 800
    spawn-count: 4
    spawn-range: 4
    drops:
      enable: false
      list:
        - material: ARROW
          min-amount: 0
          max-amount: 2
          chance: 1.0
        - material: BONE
          min-amount: 0
          max-amount: 2
          chance: 1.0
        - material: BOW
          min-amount: 1
          max-amount: 1
          chance: 0.085